# УВАГА: це навчальний приклад для локального minikube.
# Для реального продакшену паролі краще генерувати і зберігати
# через `kubectl create secret` / зовнішній secret-manager, а не в git.
apiVersion: v1
kind: Secret
metadata:
  name: medlink-secrets
  namespace: medlink
type: Opaque
stringData:
  POSTGRES_DB: medlink
  POSTGRES_USER: medlink
  POSTGRES_PASSWORD: medlink_change_me
  FLASK_SECRET_KEY: change_this_to_something_random
