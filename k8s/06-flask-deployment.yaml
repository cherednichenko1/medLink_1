apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: medlink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-app
          # Образ збирається локально і завантажується в Docker-демон minikube
          # (див. DEPLOY.md, крок з `eval $(minikube docker-env)`),
          # тому pull з реєстру не потрібен.
          image: medlink-app:v1.0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: medlink-secrets, key: POSTGRES_DB}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: medlink-secrets, key: POSTGRES_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: medlink-secrets, key: POSTGRES_PASSWORD}
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: medlink-secrets, key: FLASK_SECRET_KEY}
            - name: DOCTOR_REGISTRATION_CODE
              valueFrom:
                secretKeyRef:
                  name: medlink-secrets
                  key: DOCTOR_REGISTRATION_CODE
                  optional: true
            - name: PUBLIC_BASE_URL
              value: "http://192.168.0.9:8081"
            - name: TRUST_PROXY
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /livez
              port: 5000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
