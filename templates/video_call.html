{% extends 'base.html' %}{% block body %}<h1>Відеодзвінок</h1><p>Обидва учасники мають відкрити дзвінок і натиснути «Приєднатися». Для локального режиму потрібні одна Wi-Fi мережа і довірений HTTPS.</p><div id="callConfig" data-signals="{{ url_for('communications.signals',call_id=call_id) }}" data-initiator="{{ 'true' if initiator else 'false' }}" data-csrf="{{ csrf_token() }}"></div><p id="callStatus" role="status">Готовий до підключення.</p><div class="video-grid"><video id="remoteVideo" autoplay playsinline controls></video><video id="localVideo" autoplay playsinline muted></video></div><div class="actions"><button class="button" id="joinCall" type="button">Приєднатися</button><button class="button secondary" id="muteCall" type="button" disabled>Вимкнути мікрофон</button><button class="button secondary" id="cameraCall" type="button" disabled>Вимкнути камеру</button><button class="button secondary" id="endCall" type="button">Завершити дзвінок</button><a href="{{ url_for('communications.conversation',thread_id=thread_id) }}">До переписки</a></div><script src="{{ url_for('static',filename='video.js') }}" defer></script>{% endblock %}
