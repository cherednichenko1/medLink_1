{% extends 'base.html' %}{% block body %}<h1>{{ doctor_name if session.user_role=='user' else patient_name }}</h1><div class="actions"><button class="button secondary" type="button" data-qr-src="{{ url_for('communications.thread_qr',thread_id=thread_id) }}" data-qr-title="Переписка на іншому пристрої">QR переписки</button><a class="button secondary" href="{{ url_for('portal.documents',patient_id=patient_id) }}">Додати фото / PDF</a><form method="post" action="{{ url_for('communications.start_call',thread_id=thread_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button" type="submit">Відеодзвінок</button></form></div><a id="activeCall" class="button" hidden>Приєднатися до відеодзвінка</a><p id="messageStatus" role="status"></p><section id="messageList" class="message-list" aria-label="Історія переписки" data-updates="{{ url_for('communications.updates',thread_id=thread_id) }}" data-role="{{ session.user_role }}"></section><form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Повідомлення<textarea name="text" maxlength="4000" rows="3"></textarea></label><label>Документ із картки<select name="attachment_id"><option value="">Без вкладення</option>{% for id,title in files %}<option value="{{ id }}">{{ title }}</option>{% endfor %}</select></label><button class="button" type="submit">Надіслати</button></form><script src="{{ url_for('static',filename='messages.js') }}" defer></script>{% endblock %}
