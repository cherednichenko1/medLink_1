{% extends 'base.html' %}{% block body %}<h1>Мій профіль</h1><section class="panel avatar-editor"><img class="profile-avatar" src="{{ url_for('portal.avatar',role=session.user_role,account_id=session.user_id) }}" alt="Ваш аватар"><form class="account-form" method="post" enctype="multipart/form-data" action="{{ url_for('portal.upload_avatar') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Нове фото<input type="file" name="avatar" accept="image/jpeg,image/png" required></label><p>JPEG/PNG до 2 МБ. {% if session.user_role=='doctor' %}Аватар видимий у публічному каталозі лікарів.{% else %}Аватар доступний вам і пов’язаним лікарям.{% endif %}</p><button class="button" type="submit">Завантажити аватар</button></form><form method="post" action="{{ url_for('portal.delete_avatar') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary" type="submit">Прибрати фото</button></form></section><form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Ім’я та прізвище<input name="name" value="{{ person[0] }}" autocomplete="name" minlength="2" maxlength="150" required></label><label>Телефон<input name="phone" type="tel" value="{{ person[1] or '' }}" autocomplete="tel" minlength="5" maxlength="30" required></label><p>Email для входу: {{ person[2] }}</p><button type="submit" class="button">Зберегти профіль</button></form><form method="post" action="{{ url_for('revoke_qr_shares') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button secondary" type="submit">Відкликати QR-доступи цієї сесії</button></form>
{% endblock %}
