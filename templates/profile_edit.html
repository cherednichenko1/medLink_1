{% extends 'base.html' %}{% block body %}<h1>Мій профіль</h1><form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Ім’я та прізвище<input name="name" value="{{ person[0] }}" autocomplete="name" minlength="2" maxlength="150" required></label><label>Телефон<input name="phone" type="tel" value="{{ person[1] or '' }}" autocomplete="tel" minlength="5" maxlength="30" required></label><p>Email для входу: {{ person[2] }}</p><button type="submit" class="button">Зберегти профіль</button></form>{% endblock %}
