{% extends 'base.html' %}{% block body %}{% include 'doctor_nav.html' %}<span class="eyebrow">ВАШ РОБОЧИЙ ЧАС</span><h1>Тижневий графік</h1><p>Позначте робочі дні та години. Інтервал прийому — 30 хвилин. Зміни діють для нових записів; наявні прийоми зберігаються.</p><form class="panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="schedule-grid">{% for day in range(7) %}<div class="schedule-row"><label class="checkbox-label"><input type="checkbox" name="enabled_{{ day }}" {% if day in hours %}checked{% endif %}>{{ weekdays[day] }}</label><label>Початок<input type="time" name="start_{{ day }}" value="{{ hours[day][0].strftime('%H:%M') if day in hours else '09:00' }}" step="1800"></label><label>Завершення<input type="time" name="end_{{ day }}" value="{{ hours[day][1].strftime('%H:%M') if day in hours else '17:00' }}" step="1800"></label></div>{% endfor %}</div><button class="button" type="submit">Зберегти графік</button></form>{% endblock %}
