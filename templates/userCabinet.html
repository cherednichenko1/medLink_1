{% extends 'base.html' %}

{% block body %}
<main class="userCabinet">
  <h1>Особистий кабінет</h1>

  <div style="border: 2px solid #4682B4; background-color: #87CEEB; padding: 10px; width: 100%; margin-bottom: 20px;">
    <table style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="padding: 10px; vertical-align: top; width: 70%;">
          <p><strong>Ім'я:</strong> {{ user.name }}</p>
          <p><strong>Email:</strong> {{ user.email }}</p>
          <p><strong>Телефон:</strong> {{ user.phone }}</p>
        </td>
        <td style="padding: 10px; vertical-align: top; width: 30%; text-align: center;">
          <img src="{{ url_for('static', filename='user_placeholder.png') }}" alt="Фото користувача" style="max-width: 150px; height: auto;">
        </td>
      </tr>
    </table>
  </div>

  <a href="{{ url_for('generate_qr_user') }}" class="button">Отримати QR-код</a>
</main>
{% endblock %}
